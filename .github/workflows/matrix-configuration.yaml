name: Matrix Configuration

on:
  push:
  workflow_dispatch:

jobs:
#  deploy:
#  deploy-on-ubuntu:
    # runs-on: ubuntu-latest
    # steps:
    #   - name: Echo Docker Details
    #     run: docker info

    #   - name: Run Images
    #     run: docker run hello-world
  deploy:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, ubuntu-20.04, windows-latest]
        images: [hello-world, alpine]
        exclude:
          - os: windows-latest
            images: alpine
        include:
          - os: amd64/alpine
            images: ubuntu:20.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Echo Docker Details
        run: docker info

      - name: Run Image on ${{ matrix.os }}
        run: docker run ${{ matrix.images }}

