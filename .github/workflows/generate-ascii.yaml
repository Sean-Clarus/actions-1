name: Generate ASCII Artwork

on: [push]

jobs:
  ascii-job:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: List Repo Files
      run: ls -la

    - name: Execute Cowsay
      run: |
        chmod +x ascii-script.sh
        ./ascii-script.sh
    
